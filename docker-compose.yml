services:
  serveur-a:
    image: hashicorp/http-echo
    command: ["-text=Réponse du serveur A"]

  serveur-b:
    image: hashicorp/http-echo
    command: ["-text=Réponse du serveur B"]

  serveur-c:
    image: hashicorp/http-echo
    command: ["-text=Réponse du serveur C"]

  load-balancer:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - serveur-a
      - serveur-b
      - serveur-c