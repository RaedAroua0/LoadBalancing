events {}

http {
    # Pool de serveurs backend.
    # Nginx utilise l'algorithme round-robin par défaut.
    upstream backend {
        server serveur-a:5678;
        server serveur-b:5678;
        server serveur-c:5678;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;

            # Indique dans la réponse quel serveur a traité la requête
            add_header X-Served-By $upstream_addr always;
        }
    }
}
